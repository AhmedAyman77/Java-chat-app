spring:
  application:
    name: chat
  data:
    mongodb:
      uri: mongodb://localhost:27017/chat_db
  mail:
    host: ${MAIL_HOST:}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

app:
  jwt:
    secret: ${JWT_SECRET:change-this-secret-to-at-least-32-characters}
    expiration: ${JWT_EXPIRATION:86400}
  verification-url: ${VERIFICATION_URL:http://localhost:8080/users/verify}
